services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: school_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DST_DB_PASSWORD:-123}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: django/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: demschooltools.settings_prod
      APPLICATION_SECRET: ${APPLICATION_SECRET}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DST_DB_NAME: school_crm
      DST_DB_USER: postgres
      DST_DB_PASSWORD: ${DST_DB_PASSWORD:-123}
      DST_DB_HOST: postgres
      ROLLBAR_TOKEN: ${ROLLBAR_TOKEN:-}
      ROLLBAR_FRONTEND_TOKEN: ${ROLLBAR_FRONTEND_TOKEN:-}
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django

volumes:
  postgres_data:
