<h3>Edit user: {{ edit_user.name }}</h3>
<form method="POST" class="form-horizontal">
  {% csrf_token %}
  <div class="form-group">
    <label class="col-sm-1 control-label">Name</label>
    <div class="col-sm-4">
      <input type="text" name="name" class="form-control" value="{{ edit_user.name }}">
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-1 control-label">Email</label>
    <div class="col-sm-4">
      <input type="email" name="email" class="form-control" value="{{ edit_user.email }}">
    </div>
  </div>
  <div class="form-group">
    <div class="col-sm-offset-1 col-sm-4">
      <input type="submit" class="btn btn-primary" value="Save">
      <a href="/settings/access" class="btn btn-default">Cancel</a>
    </div>
  </div>
</form>
